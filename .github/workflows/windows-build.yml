name: Windows EXE build and runtime test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Set up Python for the build only
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and build web assets
        shell: pwsh
        run: |
          npm ci
          npm run build
          @"
          SIMULATION_MODE="true"
          FEISHU_VERIFICATION_TOKEN="local-test-token"
          FEISHU_ALLOWED_CHAT_IDS="simulated-finance-group"
          FEISHU_ALLOWED_CHAT_NAMES="模拟财经群"
          "@ | Set-Content -Encoding utf8 .dev.vars

      - name: Download portable Node runtime for the EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-runtime | Out-Null
          Invoke-WebRequest -Uri https://nodejs.org/dist/v22.13.1/node-v22.13.1-win-x64.zip -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-unpacked
          Copy-Item node-unpacked\node-v22.13.1-win-x64\node.exe build-runtime\node.exe

      - name: Build portable Windows EXE directory with PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          pyinstaller --noconfirm --clean --onedir --console --name "雪球财经助手" `
            --add-binary "build-runtime\node.exe;runtime" `
            --add-data "dist;dist" `
            --add-data "node_modules;node_modules" `
            --add-data ".dev.vars.example;." `
            --add-data "README.md;." `
            launcher.py

      - name: Start EXE and run end-to-end tests
        shell: pwsh
        env:
          XUEQIU_NO_BROWSER: '1'
        run: |
          function Stop-XueqiuTestProcesses {
            $pids = @(Get-CimInstance Win32_Process | Where-Object {
              $_.CommandLine -and $_.CommandLine -like '*雪球财经助手测试*'
            } | Select-Object -ExpandProperty ProcessId)
            foreach ($processId in $pids) { try { Stop-Process -Id $processId -Force -ErrorAction SilentlyContinue } catch {} }
          }
          $testDir = Join-Path $env:TEMP '雪球财经助手测试'
          New-Item -ItemType Directory -Force $testDir | Out-Null
          Copy-Item dist\雪球财经助手 $testDir -Recurse -Force
          $exe = Join-Path $testDir '雪球财经助手\雪球财经助手.exe'
          $env:XUEQIU_PORT = '8787'
          Write-Host "EXE exists=$((Test-Path $exe)) size=$((Get-Item $exe).Length) path=$exe"
          $stdout = Join-Path $testDir 'launcher.stdout.log'
          $stderr = Join-Path $testDir 'launcher.stderr.log'
          $proc = Start-Process -FilePath $exe -WorkingDirectory $testDir -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 5
          $proc.Refresh()
          $exitCode = if ($proc.HasExited) { $proc.ExitCode } else { 'running' }
          Write-Host "EXE pid=$($proc.Id) exited=$($proc.HasExited) exitcode=$exitCode"
          if (Test-Path $stdout) { Get-Content $stdout -Tail 40 }
          if (Test-Path $stderr) { Get-Content $stderr -Tail 80 }
          try {
            $ready = $false
            1..60 | ForEach-Object {
              if (-not $ready) {
                try { $r = Invoke-WebRequest http://127.0.0.1:8787/ -UseBasicParsing -TimeoutSec 1; if ($r.StatusCode -eq 200) { $ready = $true } } catch {}
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) { throw 'EXE 启动后网页未在 60 秒内响应' }
            $env:BASE_URL = 'http://127.0.0.1:8787'
            npm run test:e2e
            if ($LASTEXITCODE -ne 0) { throw "端到端测试进程失败，exit=$LASTEXITCODE" }
            $drafts = Invoke-RestMethod "$env:BASE_URL/api/drafts?status=pending"
            if (-not $drafts.drafts -or $drafts.drafts.Count -lt 1) { throw '端到端测试后没有可持久化的草稿' }
          } catch {
            Write-Host '--- launcher.log ---'
            $log = Join-Path $env:LOCALAPPDATA '雪球财经助手\logs\launcher.log'
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            Write-Host '--- server.log ---'
            $serverLog = Join-Path $env:LOCALAPPDATA '雪球财经助手\logs\server.log'
            if (Test-Path $serverLog) { Get-Content $serverLog -Tail 120 }
            throw
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Start-Sleep -Seconds 1
            Stop-XueqiuTestProcesses
          }

      - name: Restart EXE and verify SQLite persistence
        shell: pwsh
        env:
          XUEQIU_NO_BROWSER: '1'
        run: |
          function Stop-XueqiuTestProcesses {
            $pids = @(Get-CimInstance Win32_Process | Where-Object {
              $_.CommandLine -and $_.CommandLine -like '*雪球财经助手测试*'
            } | Select-Object -ExpandProperty ProcessId)
            foreach ($processId in $pids) { try { Stop-Process -Id $processId -Force -ErrorAction SilentlyContinue } catch {} }
          }
          $testDir = Join-Path $env:TEMP '雪球财经助手测试'
          $exe = Join-Path $testDir '雪球财经助手\雪球财经助手.exe'
          $env:XUEQIU_PORT = '8788'
          $proc = Start-Process -FilePath $exe -WorkingDirectory $testDir -PassThru
          try {
            $ready = $false
            1..60 | ForEach-Object {
              if (-not $ready) {
                try { $r = Invoke-WebRequest http://127.0.0.1:8788/ -UseBasicParsing -TimeoutSec 1; if ($r.StatusCode -eq 200) { $ready = $true } } catch {}
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) { throw '重启后的 EXE 网页未响应' }
            $drafts = Invoke-RestMethod 'http://127.0.0.1:8788/api/drafts?status=pending'
            if (-not $drafts.drafts -or $drafts.drafts.Count -lt 1) { throw '重启后 SQLite/D1 本地数据未保留' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Start-Sleep -Seconds 1
            Stop-XueqiuTestProcesses
          }

      - name: Verify occupied port handling
        shell: pwsh
        env:
          XUEQIU_NO_BROWSER: '1'
        run: |
          function Stop-XueqiuTestProcesses {
            $pids = @(Get-CimInstance Win32_Process | Where-Object {
              $_.CommandLine -and $_.CommandLine -like '*雪球财经助手测试*'
            } | Select-Object -ExpandProperty ProcessId)
            foreach ($processId in $pids) { try { Stop-Process -Id $processId -Force -ErrorAction SilentlyContinue } catch {} }
          }
          Stop-XueqiuTestProcesses
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 8787)
          $listener.Start()
          $testDir = Join-Path $env:TEMP '雪球财经助手测试'
          $exe = Join-Path $testDir '雪球财经助手\雪球财经助手.exe'
          $env:XUEQIU_PORT = '8787'
          $proc = Start-Process -FilePath $exe -WorkingDirectory $testDir -PassThru
          try {
            $fallbackReady = $false
            1..60 | ForEach-Object {
              if (-not $fallbackReady) {
                try { $r = Invoke-WebRequest http://127.0.0.1:8788/ -UseBasicParsing -TimeoutSec 1; if ($r.StatusCode -eq 200) { $fallbackReady = $true } } catch {}
                Start-Sleep -Milliseconds 500
              }
            }
            $log = Join-Path $env:LOCALAPPDATA '雪球财经助手\logs\launcher.log'
            if (-not $fallbackReady) { throw '端口占用时备用端口 8788 未响应' }
            if (-not (Test-Path $log) -or -not (Select-String -Path $log -Pattern '已占用，改用端口')) {
              if (Test-Path $log) { Get-Content $log -Tail 80 }
              throw '端口占用时未自动切换端口'
            }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            $listener.Stop()
            Start-Sleep -Seconds 1
            Stop-XueqiuTestProcesses
          }

      - name: Capture screenshot, logs, and SHA256
        shell: pwsh
        run: |
          $artifact = 'artifacts'
          New-Item -ItemType Directory -Force $artifact | Out-Null
          Copy-Item dist\雪球财经助手 "$artifact\雪球财经助手" -Recurse -Force
          $exe = Join-Path $artifact '雪球财经助手\雪球财经助手.exe'
          $hash = Get-FileHash $exe -Algorithm SHA256
          Write-Host "Windows EXE SHA256=$($hash.Hash)"
          $hash.Hash | Set-Content -Encoding ascii "$artifact\雪球财经助手.exe.sha256"
          $testDir = Join-Path $env:TEMP '雪球财经助手测试'
          $exe = Join-Path $testDir '雪球财经助手\雪球财经助手.exe'
          $env:XUEQIU_PORT = '8789'
          $env:XUEQIU_NO_BROWSER = '1'
          $proc = Start-Process -FilePath $exe -WorkingDirectory $testDir -PassThru
          try {
            1..60 | ForEach-Object {
              try { $r = Invoke-WebRequest http://127.0.0.1:8789/ -UseBasicParsing -TimeoutSec 1; if ($r.StatusCode -eq 200) { break } } catch {}
              Start-Sleep -Milliseconds 500
            }
            $edgeCandidates = @(
              (Get-Command msedge.exe -ErrorAction SilentlyContinue).Source,
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'),
              (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe')
            ) | Where-Object { $_ -and (Test-Path $_) }
            $edge = $edgeCandidates | Select-Object -First 1
            if (-not $edge) { throw 'Windows Runner 未找到 Microsoft Edge，无法采集实际运行截图' }
            & $edge --headless --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot="$artifact\windows-runtime.png" http://127.0.0.1:8789/ 2>$null
            if (-not (Test-Path "$artifact\windows-runtime.png")) { throw 'Edge 截图命令未生成 windows-runtime.png' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
          $logDir = Join-Path $env:LOCALAPPDATA '雪球财经助手\logs'
          if (Test-Path $logDir) { Copy-Item $logDir "$artifact\logs" -Recurse -Force }
          Compress-Archive -Path "$artifact\雪球财经助手" -DestinationPath "$artifact\雪球财经助手-Windows免Python.zip" -Force
          @"
          build=github-actions-windows-latest
          exe_sha256=$($hash.Hash)
          web=local HTTP endpoint responded 200
          import=10 messages, duplicate removal, draft generation, edit/save, SQLite persistence
          restart=previous draft visible after EXE restart
          unicode=Chinese executable path and UI smoke-tested
          port_conflict=automatic fallback port verified
          screenshot=windows-runtime.png captured by Microsoft Edge headless
          external_rss=not asserted by the app test; external feeds may change or be blocked
          feishu=restricted automatic collection is not included in this desktop build
          xueqiu=manual copy/open flow only; no automatic posting API
          "@ | Set-Content -Encoding utf8 "$artifact\TEST-RESULTS.txt"

      - name: Upload Windows deliverables
        uses: actions/upload-artifact@v4
        with:
          name: 雪球财经助手-Windows免Python
          path: artifacts
          if-no-files-found: error

